name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler and no dependencies: the game ships plain ES modules, so the site is a
      # file copy. Only these paths are reachable from index.html — keep the server, the
      # electron shell, the bake tool and the tests out of the artifact. The 88,179,840-cube
      # sweep that measures every `par` is a build-time job (js/core/fullsweep.js is not
      # imported by js/main.js); the browser only reads its result out of js/data/lots.js,
      # which is a generated source file like any other.
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
