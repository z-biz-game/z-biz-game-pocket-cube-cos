name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler and no dependencies: the game ships plain ES modules, so the site is a file
      # copy. Which files is written in exactly one place — tools/assemble-site.sh — and both this
      # step and tools/deploy-set.mjs call that script, so the artifact CI uploads is the artifact
      # the gate checked. Keep the server, the electron shell, the bake tool and the tests out; the
      # 88,179,840-cube sweep that measures every `par` is a build-time job (js/core/fullsweep.js
      # is not imported by js/main.js), and the browser only reads its result out of js/data/lots.js.
      - name: Assemble static site
        run: bash tools/assemble-site.sh _site
      - name: Deploy set gate (checks the very _site about to be uploaded)
        run: node tools/deploy-set.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
