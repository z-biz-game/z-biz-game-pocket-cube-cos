name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler and no dependencies: the game ships plain ES modules, so the site is a
      # file copy. The list below is whatever index.html, css/game.css and manifest.webmanifest
      # reach for, and test/shell.test.mjs fails the suite if a path is referenced but not copied
      # here — the first version of this step shipped only index.html, css and js, so every icon,
      # the manifest, the service worker and both textures 404'd on Pages while looking complete in
      # the repo. Keep the server, the electron shell, the bake tool and the tests out. The
      # 88,179,840-cube sweep that measures every `par` is a build-time job
      # (js/core/fullsweep.js is not imported by js/main.js); the browser only reads its result
      # out of js/data/lots.js, which is a generated source file like any other.
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons assets social _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
